# ============================================================================
# E2E test profile - boots the full gateway WITHOUT external infrastructure
# (no Nacos / Redis / Admin console / Jaeger / license server required)
# ============================================================================

# Random server port
server.port=0

# --- Service discovery: fully disabled ---
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.discovery.register-enabled=false
spring.cloud.nacos.discovery.fail-fast=false
spring.cloud.gateway.discovery.locator.enabled=false

# --- Config center: keep nacos type (beans required) but it may be unreachable;
# --- refreshers tolerate connection failures and routes/strategies are
# --- injected programmatically via RouteManager/StrategyManager in tests.
gateway.center.type=nacos

# --- Admin console: unreachable on purpose (heartbeat / sync must degrade gracefully) ---
gateway.admin.url=http://127.0.0.1:65535
gateway.heartbeat.enabled=false

# --- SSL: disabled (no cert loading from admin) ---
gateway.ssl.enabled=false
gateway.ssl.auto-load=false

# --- Rate limiting: force local window limiter, no shadow quota interference ---
gateway.rate-limiter.redis.enabled=false
gateway.rate-limiter.shadow-quota.enabled=false

# --- Tracing / access log noise off ---
gateway.trace.capture-all=false
gateway.trace.capture-errors=false
gateway.trace.capture-slow=false
management.tracing.enabled=false
management.otlp.metrics.export.enabled=false
otel.sdk.disabled=true

# --- License: no license code -> fallback edition. Use ENTERPRISE so
# --- ADVANCED+ features (circuit breaker) are testable in E2E. ---
license.client.enabled=true
license.client.license-code=
license.client.fallback-edition=ENTERPRISE
license.client.allow-basic-fallback=true
