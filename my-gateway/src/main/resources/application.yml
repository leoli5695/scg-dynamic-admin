server:
  port: ${SERVER_PORT:80}  # HTTP port
  # HTTPS Configuration - disabled by default, use dynamic SSL loading via gateway.ssl.enabled
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
  # Additional HTTPS port
  http2:
    enabled: true

spring:
  main:
    web-application-type: reactive
  web:
    resources:
      add-mappings: false  # 禁用静态资源映射（避免/**被其他handler匹配）
  application:
    name: my-gateway
  config:
    import:
      - optional:classpath:config/cache-settings.yml
  autoconfigure:
    exclude:
      - org.springframework.cloud.consul.discovery.ConsulDiscoveryClientConfiguration
      - org.springframework.cloud.consul.discovery.ReactiveConsulDiscoveryClientConfiguration
      - org.springframework.cloud.consul.serviceregistry.ConsulAutoServiceRegistrationAutoConfiguration
  cloud:
    # Enable load balancer with DiscoveryClient
    loadbalancer:
      enabled: true
    
    # ============================================================================
# Nacos Discovery (config is pulled manually, not via Spring Cloud Nacos Config)
# ============================================================================
# K8s NodePort 映射：Nacos(8848) -> 30848
# 本地开发连接 K8s test 命名空间的 Nacos
# ============================================================================
    nacos:
      # Direct properties for NacosCenterAutoConfiguration (must be at this level, not under discovery)
      serverAddr: ${NACOS_SERVER_ADDR:localhost:30848}
      # Namespace - defaults to empty (public namespace) if not set
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:30848}
        # Namespace - defaults to empty (public namespace) if not set
        namespace: ${NACOS_NAMESPACE:}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}  # Same override as gateway-admin; k8s/my-gateway.yaml injects status.podIP, bare-metal must set a routable IP

    # ============================================================================
    # Consul Configuration (alternative to Nacos)
    # ============================================================================
    # K8s NodePort 映射：Consul(8500) -> 30500
    # 本地开发禁用 Consul
    # ============================================================================
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:30500}
      config:
        enabled: false
        import-check:
          enabled: false
        prefixes: ${CONSUL_CONFIG_PREFIX:config}
      discovery:
        enabled: ${CONSUL_DISCOVERY_ENABLED:false}
        health-check-path: ${CONSUL_HEALTH_CHECK_PATH:/actuator/health}
        health-check-interval: ${CONSUL_HEALTH_CHECK_INTERVAL:10s}
      service-registry:
        enabled: ${CONSUL_SERVICE_REGISTRY_ENABLED:false}
      enabled: false  # Explicitly disable Consul

    gateway:
      discovery:
        locator:
          enabled: ${GATEWAY_DISCOVERY_LOCATOR_ENABLED:true}
          # Enable lowerCaseServiceId for easier routing
          lower-case-service-id: ${GATEWAY_LOWER_CASE_SERVICE_ID:false}
      # Routing (upstream) client - the one that actually proxies requests.
      # Keep this under spring.cloud.gateway, alongside discovery (not spring.gateway).
      httpclient:
        pool:
          # FIXED with an explicit cap rather than ELASTIC (unbounded, exhausts file
          # descriptors under a stream-heavy AI workload). reactor-netty counts
          # max-connections per upstream host, so it must be >= the concurrent
          # streams expected per provider per node.
          type: ${GATEWAY_HTTPCLIENT_POOL_TYPE:FIXED}
          max-connections: ${GATEWAY_HTTPCLIENT_MAX_CONNECTIONS:2000}
          acquire-timeout: ${GATEWAY_HTTPCLIENT_ACQUIRE_TIMEOUT:45000}
          max-idle-time: ${GATEWAY_HTTPCLIENT_MAX_IDLE_TIME:60000}
        connect-timeout: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT:5000}
        # LLM scale: reasoning models can take minutes before the first byte, and a
        # short timeout cuts long completions off mid-stream.
        response-timeout: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:300s}
        # Asking upstream for gzip makes it buffer SSE events, which destroys
        # time-to-first-token on streaming responses.
        compression: false
      # Actuator endpoints share the main HTTP port (80 by default).


  # FIX (P1 scheduler starvation): @Scheduled defaults to a SINGLE-thread pool.
  # With ~12 scheduled tasks (health checks, instance heartbeat, config refresh,
  # shadow-quota snapshots), one blocking task delays all the others - notably the
  # heartbeat, which made admin mark a healthy gateway as DOWN. Give the scheduler
  # a small pool so tasks run concurrently instead of serializing behind a blocker.
  task:
    scheduling:
      pool:
        size: ${GATEWAY_SCHEDULER_POOL_SIZE:8}

  # ============================================================================
  # Redis Configuration (for distributed rate limiting)
  # ============================================================================
  # K8s NodePort 映射：Redis(6379) -> 30379
  # Redis is optional - set REDIS_ENABLED=true or REDIS_HOST to enable
  # Supports three deployment modes: single (default), sentinel, cluster
  # ============================================================================
  data:
    redis:
      # Deployment mode: single, sentinel, cluster
      # Default: single (standalone instance)
      # NOTE: `mode` is this project's own key, not a Boot one - RedisConfig reads it
      # directly and Boot's RedisProperties ignores unknown fields.
      mode: ${REDIS_MODE:single}

      # --- Common Configuration ---
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000}

      # --- Single Node Configuration (mode=single) ---
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:30379}

      # --- Sentinel Configuration (mode=sentinel) ---
      # Uncomment below for sentinel mode
      # sentinel:
      #   master: ${REDIS_SENTINEL_MASTER:mymaster}
      #   # Comma-separated list of sentinel hosts (host:port,host:port,...)
      #   nodes: ${REDIS_SENTINEL_NODES:}
      #   # Password for sentinel (if required)
      #   password: ${REDIS_SENTINEL_PASSWORD:}

      # --- Cluster Configuration (mode=cluster) ---
      # Uncomment below for cluster mode
      # cluster:
      #   # Comma-separated list of cluster nodes (host:port,host:port,...)
      #   nodes: ${REDIS_CLUSTER_NODES:}
      #   max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}

      # Connection pool configuration
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

# Gateway Center Configuration
# Set type to 'nacos' (default) or 'consul' to switch between config centers
gateway:
  # Request Trace Configuration - for topology Client nodes
  trace:
    # Body sampling is decided before allocation; error/slow metadata is captured separately.
    body-sampling-rate: ${GATEWAY_TRACE_BODY_SAMPLING_RATE:10}
    max-inflight-body-bytes: ${GATEWAY_TRACE_MAX_INFLIGHT_BODY_BYTES:16777216}
    capture-all: ${GATEWAY_TRACE_CAPTURE_ALL:true}  # set to false in production
    capture-errors: ${GATEWAY_TRACE_CAPTURE_ERRORS:true}
    capture-slow: ${GATEWAY_TRACE_CAPTURE_SLOW:true}
    slow-threshold-ms: ${GATEWAY_TRACE_SLOW_THRESHOLD:3000}
    sampling-rate: ${GATEWAY_TRACE_SAMPLING_RATE:50}
    sampling-rate-for-errors: ${GATEWAY_TRACE_SAMPLING_RATE_ERRORS:100}
    max-body-size: ${GATEWAY_TRACE_MAX_BODY_SIZE:65536}
    include-filter-chain: ${GATEWAY_TRACE_INCLUDE_FILTER_CHAIN:true}
  # Gateway instance identifier (used for trace data and health status reporting)
  instance-id: ${GATEWAY_INSTANCE_ID:gateway-1}

  # How often every refresher reconciles its configs against the config center.
  # This poll, not the change listener, is what carries console edits and deletions:
  # nacos-client 3.0.3 receives no pushes from nacos-server 2.5.4 (measured live - the
  # server logs the publish, its remote-push log stays empty, no callback fires).
  # The value is therefore the worst-case delay before a route/strategy/service/auth
  # policy/certificate/plugin change takes effect, and each cycle costs one read per
  # indexed config, so lowering it trades config-center load for faster propagation.
  config-sync:
    interval-ms: ${GATEWAY_CONFIG_SYNC_INTERVAL_MS:60000}

  # Admin service URL for health status sync and API calls
  admin:
    url: ${GATEWAY_ADMIN_URL:http://127.0.0.1:9090}

  # Plugin loading security (P1 RCE hardening). Each plugin JAR is verified before
  # its classes are loaded:
  #  - base-dir: trusted directory JARs must reside in (canonical-path confinement).
  #    Empty disables confinement - SET THIS IN PRODUCTION to the shared plugin dir
  #    the admin console uploads to.
  #  - require-hash: refuse a plugin whose Nacos config lacks a SHA-256 jarHash
  #    matching the on-disk JAR (admin publishes jarHash at upload). Set false only
  #    to migrate legacy configs published before jarHash existed.
  plugin:
    base-dir: ${GATEWAY_PLUGIN_BASE_DIR:}
    require-hash: ${GATEWAY_PLUGIN_REQUIRE_HASH:true}

  # Data-plane JWT revocation. The admin console blacklists tokens in Redis under
  # gateway:jwt:revoked:* (POST /api/gateway/jwt-revocations); every JWT request,
  # including validation-cache hits, is checked against it. Requires Redis - with
  # Redis absent or unreachable the check is skipped (fail open) and tokens stay
  # valid until their own exp.
  jwt:
    revocation:
      enabled: ${GATEWAY_JWT_REVOCATION_ENABLED:true}

  # Instance-wide retained-response budget; each route also defaults to 64 MiB.
  response-cache:
    max-bytes: ${GATEWAY_RESPONSE_CACHE_MAX_BYTES:268435456}

  # HMAC bodies are buffered for signature verification, then replayed to upstream.
  auth:
    hmac:
      max-body-bytes: ${GATEWAY_HMAC_MAX_BODY_BYTES:1048576}

  # Timeout Configuration
  # Fallbacks for fields a configured timeout strategy omits. Routes with NO strategy get no route metadata, so spring.cloud.gateway.httpclient.* above applies.
  timeout:
    default-connect-timeout: ${GATEWAY_TIMEOUT_CONNECT:1000}
    default-response-timeout: ${GATEWAY_TIMEOUT_RESPONSE:30000}

  # Heartbeat Configuration
  # Gateway reports heartbeat to Admin Console for instance health monitoring
  heartbeat:
    enabled: ${GATEWAY_HEARTBEAT_ENABLED:true}
    interval-ms: ${GATEWAY_HEARTBEAT_INTERVAL:10000}
    timeout-ms: ${GATEWAY_HEARTBEAT_TIMEOUT:5000}
    initial-delay-ms: ${GATEWAY_HEARTBEAT_INITIAL_DELAY:30000}
    max-retries: ${GATEWAY_HEARTBEAT_MAX_RETRIES:3}
    retry-interval-ms: ${GATEWAY_HEARTBEAT_RETRY_INTERVAL:1000}
  center:
    type: ${GATEWAY_CENTER_TYPE:nacos}

  # Trusted Proxy Configuration for X-Forwarded-For validation
  # When gateway is behind a reverse proxy (Nginx, CloudFlare, AWS ALB),
  # configure trusted proxy IPs to securely extract real client IP.
  trusted-proxy:
    enabled: ${TRUSTED_PROXY_ENABLED:true}
    # Trust all private network IPs as proxies (10.x, 172.16-31.x, 192.168.x, 127.x)
    # Disable this in public cloud deployments with public-facing load balancers
    trust-private-networks: ${TRUSTED_PROXY_PRIVATE_NETWORKS:true}
    # Additional trusted proxy IPs (optional, supports CIDR notation)
    # Example: proxy-ips: ["1.2.3.4", "5.6.7.0/24"]
    proxy-ips: []
    # Which IP to use from X-Forwarded-For chain: FIRST (client) or LAST (closest proxy)
    position: FIRST
    # Maximum IPs to process in X-Forwarded-For (DoS protection)
    max-forwarded-ips: 10

  # Health Check Configuration
  health:
    enabled: true
    failure-threshold: 3
    recovery-time: 30000
    idle-threshold: 300000
    
    # Active health check interval (milliseconds)
    # Note: Gateway's main responsibility is routing, not health monitoring.
    # Active check is only for fixed nodes (static:// protocol).
    # Passive check handles real-time failures during user calls.
    active-check-interval-ms: 30000
    
    # Health status sync interval (milliseconds)
    # Sync to Admin DB periodically for UI display.
    # Users need time to open console, so 30s is acceptable.
    sync-interval-ms: 30000
    
    # Batch size for health status push
    batch-size: 50
    
    # Network flap detection threshold
    # If more than this number of instances change state at once, it's considered network flap
    network-flap-threshold: 10
  
  # Active Health Check Configuration - DISABLED: Actuator removed
  # health-check:
  #   endpoint: /actuator/health
  #   timeout: 3000
  #   http-enabled: ${GATEWAY_HEALTH_CHECK_HTTP_ENABLED:true}
  #   http-path: ${GATEWAY_HEALTH_CHECK_PATH:/actuator/health}
  
  # Rate Limiter Configuration
  rate-limiter:
    # Redis 限流开关（默认 true，可手动关闭强制使用本地限流）
    redis:
      enabled: ${REDIS_LIMITER_ENABLED:true}

  # WAF / SecurityGlobalFilter
  security:
    # Ceiling on how much of a request body the WAF will buffer and regex-scan. Requests declaring a
    # larger Content-Length are rejected outright, and streaming bodies are cut off at this many bytes.
    # This is the knob for WAF-driven memory pressure: the scan runs on boundedElastic, which the
    # token-quota, semantic-cache and SSL-refresh paths share. The WAF's own rule set (SQL/XSS
    # patterns, BLOCK vs DETECT, excludePaths) comes from the strategy config, not from here.
    # Was hardcoded at 10MB while the code comment claimed this key already existed.
    max-body-size-mb: ${GATEWAY_SECURITY_MAX_BODY_SIZE_MB:10}

  # Shadow quota (local fallback used while Redis is unavailable)
  shadow-quota:
    # How often per-route global-QPS snapshots are refreshed from Redis. Each route costs one SCAN
    # plus one ZCARD per matching key, so this is deliberately NOT on the 1s health tick - see
    # ScheduleConstants.QUOTA_SNAPSHOT_INTERVAL_MS. The Redis liveness probe and the recovery ramp
    # stay at 1s; only this snapshot work is throttled.
    snapshot-interval-ms: ${GATEWAY_SHADOW_QUOTA_SNAPSHOT_INTERVAL_MS:10000}

  # SSL/HTTPS Configuration
  ssl:
    # Enable HTTPS on port 443
    enabled: ${GATEWAY_SSL_ENABLED:true}
    # Auto-load certificates from Admin API
    auto-load: ${GATEWAY_SSL_AUTO_LOAD:true}
    # Certificate refresh interval (ms)
    refresh-interval: ${GATEWAY_SSL_REFRESH_INTERVAL:30000}

logging:
  level:
    # 核心日志
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    com.alibaba.nacos: ${LOG_LEVEL_NACOS:INFO}
    com.ecwid.consul: ${LOG_LEVEL_CONSUL:INFO}

    # Gateway 项目日志
    com.leoli.gateway: INFO
    com.leoli.gateway.health: INFO
    com.leoli.gateway.filter: INFO
    com.leoli.gateway.ssl: INFO
    com.leoli.gateway.refresher: INFO

    # 【已禁用】告警服务日志 - 避免噪音
    com.leoli.gateway.monitor: WARN
    
    # 抑制自动配置日志噪音
    org.springframework.boot.autoconfigure: WARN
    org.springframework.boot.autoconfigure.condition: WARN
    org.springframework.boot.actuate: WARN
    org.springframework.cloud.client: WARN
    org.springframework.cloud.commons: WARN
# Management/Actuator - Enabled on SAME PORT (port 80) to avoid HttpHandler binding issues
# NOTE: Do NOT configure management.server.port separately - this causes the multi-port HttpHandler conflict
# See: https://github.com/spring-cloud/spring-cloud-gateway/issues/3786
# Prometheus scrapes from http://gateway:80/actuator/prometheus (same port as main application)
management:
  # NO separate management.server.port - use main port 80
  # 策略：默认全启用（enabled-by-default 默认 true）+ 精确控制 exposure.include
  # 只通过 exposure.include 控制 Web 暴露范围，避免端点被禁用后落入网关路由匹配导致 404
  endpoints:
    web:
      exposure:
        # Security: only expose essential endpoints by default.
        # Add gateway*, routes, services, strategies via ACTUATOR_EXPOSURE_INCLUDE for debugging.
        include: ${ACTUATOR_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      show-details: never  # 安全加固：不暴露健康详情，防止泄露内部组件状态
  metrics:
    tags:
      application: ${spring.application.name}
      gateway_instance_id: ${GATEWAY_INSTANCE_ID:unknown}
  # ============================================================================
  # OpenTelemetry Tracing Configuration
  # ============================================================================
  # K8s NodePort 映射：OTLP HTTP(4318) -> 30263
  # 连接 K8s test 命名空间的 Jaeger
  # ============================================================================
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}  # 1.0 = 100% sampling; set to 0.1 in production
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:30263/v1/traces}
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:true}
        step: ${OTEL_METRICS_EXPORT_STEP:1m}
  health:
    consul:
      enabled: false
    liveness:
      enabled: true
    readiness:
      enabled: true

# SpringDoc OpenAPI Configuration - DISABLED: Actuator removed
# springdoc:
#   api-docs:
#     enabled: ${SPRINGDOC_ENABLED:true}
#     path: /v3/api-docs
#   swagger-ui:
#     enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
#     path: /swagger-ui.html
#   show-actuator: true

# ============================================================================
# OpenTelemetry SDK Configuration
# ============================================================================
# K8s NodePort 映射：OTLP HTTP(4318) -> 30263
# ============================================================================
otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:false}
  service:
    name: ${spring.application.name:my-gateway}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:30263}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:otlp}

# ============================================================================
# License Configuration (Commercial Features)
# ============================================================================
# license-client validates offline (RSA over a Base64 license code); nothing here
# ever dials a license-server. Without GATEWAY_LICENSE_CODE the gateway runs on the
# locally built fallback license, so fallback-edition alone decides what is enabled.
# It defaults to ENTERPRISE: this deployment ships no license-server, and BASIC
# silently turns off far more than the paid-tier features one would expect - among
# the 35 gated features are JWT_AUTH and HMAC_AUTH (ADVANCED), DISTRIBUTED_RATE_LIMIT
# and CIRCUIT_BREAKER (ADVANCED), and SSL_MANAGEMENT, AUDIT_LOG and PLUGIN_SYSTEM
# (ENTERPRISE). Set LICENSE_FALLBACK_EDITION=BASIC to restore the restricted tier.
# Note that fallback-edition is what FeatureGatekeeper enforces; it is NOT derived
# from `enabled`, and hasFeature() ignores it when no license is loaded at all.
# ============================================================================
license:
  client:
    enabled: ${LICENSE_ENABLED:true}
    license-code: ${GATEWAY_LICENSE_CODE:}
    license-file: ${GATEWAY_LICENSE_FILE:}
    # SECURITY: pin the license-server signing public key (same value as its
    # LICENSE_RSA_PUBLIC_KEY). A license carries its own publicKey, so without
    # pinning anyone can self-sign one. Comma-separate multiple keys/fingerprints
    # to support rotation. If left empty the validator FAILS CLOSED and the gateway
    # drops to fallback-edition.
    trusted-public-keys: ${LICENSE_TRUSTED_PUBLIC_KEYS:}
    trusted-key-fingerprints: ${LICENSE_TRUSTED_KEY_FINGERPRINTS:}
    fallback-edition: ${LICENSE_FALLBACK_EDITION:ENTERPRISE}
    allow-basic-fallback: ${LICENSE_ALLOW_BASIC_FALLBACK:true}
    log-unlicensed-access: ${LICENSE_LOG_UNLICENSED_ACCESS:true}
    warn-days-before-expiry: ${LICENSE_WARN_DAYS_BEFORE_EXPIRY:30}
    validation-interval-seconds: ${LICENSE_VALIDATION_INTERVAL:3600}
