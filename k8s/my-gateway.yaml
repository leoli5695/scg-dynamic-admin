---
# my-gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-gateway
  namespace: test
  labels:
    app: my-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-gateway
  template:
    metadata:
      labels:
        app: my-gateway
        gateway_instance_id: "gateway-k8s"
    spec:
      containers:
      - name: my-gateway
        image: my-gateway:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        # NOTE: there is deliberately no separate management port. Actuator is served on the main
        # application port (my-gateway/application.yml: "Do NOT configure management.server.port
        # separately - this causes the multi-port HttpHandler conflict", see spring-cloud-gateway
        # issue 3786). A containerPort 8081 named "management" used to be declared here and all
        # three probes targeted it, so nothing was ever listening: pods never became ready, the
        # Deployment stalled, the HPA got no metrics and the Service had no endpoints.
        #
        # The application port is 8080, not the 80 that application.yml defaults to: this
        # container runs as a non-root user, which cannot bind a privileged port (<1024) without
        # CAP_NET_BIND_SERVICE. The Service below still presents 80 externally.
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: NACOS_SERVER_ADDR
          value: "nacos:8848"
        - name: NACOS_NAMESPACE
          value: ""
        - name: NACOS_DISCOVERY_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GATEWAY_ADMIN_URL
          value: "http://gateway-admin:9090"
        # Shared secret for admin internal report endpoints (X-Internal-Token).
        # REQUIRED - the gateway refuses to start when empty (same posture as the
        # JWT secret). Must match gateway.admin.security.internal-token on
        # gateway-admin. Provided via the gateway-internal-secrets Secret
        # (see gateway-secrets.yaml) instead of an inline value, so a real token
        # never lands in this manifest. One-time setup:
        #   kubectl -n test create secret generic gateway-internal-secrets \
        #     --from-literal=internal-token="$(openssl rand -base64 32)"
        - name: GATEWAY_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: gateway-internal-secrets
              key: internal-token
        - name: GATEWAY_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GATEWAY_CENTER_TYPE
          value: "nacos"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: GATEWAY_SSL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4318"
        - name: OTEL_TRACING_ENABLED
          value: "true"
        - name: OTEL_SDK_DISABLED
          value: "false"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

---
# my-gateway Service
apiVersion: v1
kind: Service
metadata:
  name: my-gateway
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: my-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: https
    port: 443
    targetPort: https
  # No "management" port: actuator is served on the application port, so scrape
  # http://my-gateway/actuator/prometheus (Service port 80 -> container 8080). The 8081->8081
  # entry that used to be here forwarded to a port nothing listened on.

---
# my-gateway HPA - Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-gateway-hpa
  namespace: test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # CPU 使用率触发扩缩容
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # 内存使用率触发扩缩容
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # 自定义指标：每秒请求数（需要 Prometheus Adapter）
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_server_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: 1000
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
# my-gateway Ingress - 外部流量入口
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-gateway-ingress
  namespace: test
  annotations:
    # SSL 配置（如果需要）
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-ssl-secret: "test/gateway-tls"
    # 连接超时配置
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # 限流配置（可选）
    # nginx.ingress.kubernetes.io/limit-rps: "100"
    # CORS 配置（可选）
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Request-Id, X-Trace-Id"
    # FIX: removed `nginx.ingress.kubernetes.io/rewrite-target: /`. Combined with
    # `path: /` + `pathType: Prefix` it rewrote EVERY request to "/", so /api/foo reached
    # the gateway as / and no route ever matched. A rewrite-target only makes sense with a
    # capture group in the path (e.g. path: /foo(/|$)(.*) + rewrite-target: /$2).
    # FIX: `kubernetes.io/ingress.class` is a deprecated annotation, replaced by
    # spec.ingressClassName below.
spec:
  ingressClassName: nginx
  rules:
  # HTTP 路由
  - host: gateway.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-gateway
            port:
              number: 80
  # HTTPS 路由（需要 TLS secret）
  # tls:
  # - hosts:
  #   - gateway.example.com
  #   secretName: gateway-tls

---
# my-gateway PodDisruptionBudget - 保证最小可用副本
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: my-gateway-pdb
  namespace: test
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: my-gateway