# ============================================================================
# MySQL Exporter Credentials (Secret template)
# ============================================================================
# Provides the DATA_SOURCE_NAME used by mysql-exporter (mysql.yaml, exporters.yaml).
#
# SECURITY: never commit real credentials. Either:
#   1. Edit the placeholder below BEFORE applying (file stays untracked via
#      your local changes), or preferably
#   2. Create the secret out-of-band and skip applying this file:
#      kubectl -n test create secret generic mysql-exporter-credentials \
#        --from-literal=data-source-name='user:password@(host.rancher-desktop.internal:3306)/'
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-exporter-credentials
  namespace: test
type: Opaque
stringData:
  # FORMAT: user:password@(host:port)/
  data-source-name: "CHANGE_ME_USER:CHANGE_ME_PASSWORD@(host.rancher-desktop.internal:3306)/"
