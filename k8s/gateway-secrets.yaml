# ============================================================================
# Gateway Internal API Secrets (Secret template)
# ============================================================================
# Shared secret between gateway instances and gateway-admin, sent as the
# X-Internal-Token header on heartbeat / trace upload / health sync calls.
# Both sides fail to start when the token is empty, and a mismatch 401s every
# report call, so the SAME value must be configured on:
#   - gateway instances:  GATEWAY_INTERNAL_TOKEN (k8s/my-gateway.yaml secretKeyRef)
#   - gateway-admin:      GATEWAY_INTERNAL_TOKEN env (docker-compose / deployment)
#
# SECURITY: do not commit real secrets. Prefer creating it out-of-band:
#   kubectl -n test create secret generic gateway-internal-secrets \
#     --from-literal=internal-token="$(openssl rand -base64 32)"
# Apply this file only for local clusters, after replacing the placeholder.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: gateway-internal-secrets
  namespace: test
type: Opaque
stringData:
  internal-token: "CHANGE_ME_GENERATE_WITH_openssl_rand_base64_32"
