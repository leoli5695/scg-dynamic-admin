# ============================================================================
# MySQL Exporter - 监控本地 MySQL
# ============================================================================
# 本地 MySQL 运行在宿主机 127.0.0.1:3306
# Rancher Desktop 访问宿主机: host.rancher-desktop.internal

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter
  namespace: test
  labels:
    app: mysql-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exporter
  template:
    metadata:
      labels:
        app: mysql-exporter
    spec:
      containers:
      - name: mysql-exporter
        image: prom/mysqld-exporter:v0.15.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9104
          name: metrics
        env:
        # Credentials come from the mysql-exporter-credentials Secret
        # (see mysql-credentials.yaml) - never inline DSNs here.
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-exporter-credentials
              key: data-source-name
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: mysql-exporter
  ports:
  - port: 9104
    targetPort: 9104
    name: metrics