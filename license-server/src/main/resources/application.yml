server:
  port: 8090  # License Server 端口

spring:
  application:
    name: license-server
  # ============================================================================
  # MySQL 数据源配置
  # ============================================================================
  # 默认连接本地 MySQL：127.0.0.1:3306
  # 数据库名：license_server（存储 License、审计日志等）
  # ============================================================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # socketTimeout is what unwedges the pool after a DB restart: without it a dead socket blocks
    # the read forever, and Hikari cannot retire a connection that is still checked out.
    url: jdbc:mysql://${LICENSE_DB_HOST:127.0.0.1}:${LICENSE_DB_PORT:3306}/license_server?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=${LICENSE_DB_CONNECT_TIMEOUT:10000}&socketTimeout=${LICENSE_DB_SOCKET_TIMEOUT:60000}
    username: ${LICENSE_DB_USERNAME:root}
    password: ${LICENSE_DB_PASSWORD:123456}
    hikari:
      # Hikari's own keepalive default is 120s; 30s evicts a dead idle connection sooner.
      keepalive-time: ${LICENSE_DB_KEEPALIVE_TIME:30000}
  jpa:
    hibernate:
      ddl-auto: update  # Auto-create tables if not exist
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ============================================================================
# License Server 配置
# ============================================================================
# RSA 密钥：用于 License 签名和验证
# 生产环境必须通过环境变量设置
# ============================================================================
license:
  server:
    production-mode: ${LICENSE_PRODUCTION_MODE:false}
    # HTTP Basic credentials for the management API (create / revoke / renew / generate-keys).
    # Both blank by default: SecurityConfig then denies those endpoints outright rather than
    # advertising a login nothing can satisfy. There is no built-in account and no default password.
    management:
      username: ${LICENSE_SERVER_MANAGEMENT_USERNAME:}
      password: ${LICENSE_SERVER_MANAGEMENT_PASSWORD:}
    rsa:
      # 生产环境必须设置环境变量
      private-key: ${LICENSE_RSA_PRIVATE_KEY:}
      public-key: ${LICENSE_RSA_PUBLIC_KEY:}
      key-size: 2048
    audit-log:
      retention-days: 365
      enabled: true
    edition-defaults:
      basic:
        features: "BASIC_ROUTING,LOCAL_RATE_LIMIT,BASIC_AUTH,DOCKER_DEPLOY,HEALTH_CHECK,SERVICE_DISCOVERY,TIMEOUT_CONFIG,BASIC_LOGGING,BASIC_METRICS"
        quotas: '{"maxInstances":1,"maxRoutes":10,"maxServices":5,"maxStrategies":10,"maxRateLimitQPS":100,"supportLevel":"COMMUNITY"}'
      advanced:
        features: "WEIGHTED_ROUTING,DISTRIBUTED_RATE_LIMIT,CIRCUIT_BREAKER,PROMETHEUS_MONITORING,K8S_DEPLOY,JWT_AUTH,HMAC_AUTH,GRAY_RELEASE_BASIC,INSTANCE_QUOTA_3"
        quotas: '{"maxInstances":3,"maxRoutes":100,"maxServices":50,"maxStrategies":100,"maxRateLimitQPS":10000,"maxApiCopilotCalls":1000,"supportLevel":"PROFESSIONAL"}'
      enterprise:
        features: "WEIGHTED_ROUTING,DISTRIBUTED_RATE_LIMIT,CIRCUIT_BREAKER,PROMETHEUS_MONITORING,K8S_DEPLOY,JWT_AUTH,HMAC_AUTH,GRAY_RELEASE_BASIC,FULL_GRAY_RELEASE,AI_COPilot,FULL_CHAIN_TRACE,MULTI_TENANT,OAUTH2_AUTH,SSL_MANAGEMENT,AUDIT_LOG,STRESS_TEST,REQUEST_REPLAY,TOPOLOGY_VIEW,KUBERNETES_MANAGER,INSTANCE_UNLIMITED,ENTERPRISE_SUPPORT"
        quotas: '{"maxInstances":-1,"maxRoutes":-1,"maxServices":-1,"maxStrategies":-1,"maxRateLimitQPS":-1,"maxApiCopilotCalls":-1,"supportLevel":"ENTERPRISE"}'

# ============================================================================
# Security 配置
# ============================================================================
# License 管理接口用 HTTP Basic 认证，凭据在 license.server.management（见上方）。
# 客户端用的 validate / features / quotas 与 health、swagger 保持公开。
# ============================================================================

# ============================================================================
# SpringDoc OpenAPI 配置
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.leoli.license.controller
  default-produces-media-type: application/json

# ============================================================================
# Management 配置
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.leoli.license: INFO
    org.springframework.security: INFO