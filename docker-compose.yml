version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: gateway-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: gateway_admin
      MYSQL_USER: gateway_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-gateway_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./gateway-admin/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./gateway-admin/src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  # Nacos Configuration Center
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: gateway-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: embedded
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  # Backend Service
  backend:
    build:
      context: ./gateway-admin
      dockerfile: Dockerfile
    container_name: gateway-backend
    environment:
      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gateway_admin
      DB_USERNAME: gateway_user
      DB_PASSWORD: ${DB_PASSWORD:-gateway_password}
      
      # JWT Configuration (REQUIRED - generate a strong secret)
      GATEWAY_ADMIN_JWT_SECRET: ${GATEWAY_ADMIN_JWT_SECRET:?JWT secret is required. Generate with: openssl rand -base64 64}

      # Encryption key for AI API keys / SSL keystore passwords (REQUIRED, min 16 chars)
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?Encryption key is required. Generate with: openssl rand -base64 32}

      # Shared secret for gateway instance internal report endpoints (heartbeat/traces/health sync).
      # REQUIRED - startup fails when empty. Must match gateway.admin.internal-token on gateway instances.
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?Internal token is required. Generate with: openssl rand -base64 32}
      
      # Nacos Configuration
      NACOS_SERVER_ADDR: nacos:8848
      
      # Spring Profiles
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - gateway-network

  # Frontend Service
  frontend:
    build:
      context: ./gateway-ui
      dockerfile: Dockerfile
    container_name: gateway-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gateway-network

volumes:
  mysql_data:
    driver: local
  nacos_data:
    driver: local

networks:
  gateway-network:
    driver: bridge
