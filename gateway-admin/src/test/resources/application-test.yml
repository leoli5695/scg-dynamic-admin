server:
  port: 9091

spring:
  application:
    name: gateway-admin-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gateway_admin_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: 127.0.0.1
      # Mirrors the main config's ${REDIS_PORT:30379}. This used to hardcode 6379, which on a
      # developer machine is typically the password-protected instance, so every Redis call
      # failed with RedisConnectionFailureException and surfaced as a 500 in whichever
      # endpoint touched it. Redis is a hard requirement here: ShedLock uses the Redis lock
      # provider, so scheduled tasks fail without it.
      port: ${REDIS_PORT:30379}
      database: 1
  cache:
    type: simple
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: gateway-test
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: gateway-test
        group: DEFAULT_GROUP

logging:
  level:
    com.leoli.gateway: DEBUG
    org.springframework.web: DEBUG

# --- Security secrets: JwtTokenProvider and InternalApiTokenFilter both fail fast
# --- at startup when these are unset/weak. Provide fixed test-only values so the
# --- Spring context can load in @SpringBootTest/@DataJpaTest slices. ---
gateway:
  admin:
    jwt:
      secret: test-only-jwt-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
    security:
      internal-token: test-only-internal-token
    ssl:
      encryption-key: test-only-encryption-key-0123456789abcdef

# --- License edition for tests ---
# No license code is configured in tests, so LicenseStore builds a fallback license.
# The default BASIC fallback does not grant ADVANCED_AUDIT, which makes the audit
# timeline/export endpoints throw LicenseFeatureNotAllowedException - those tests are
# about audit behaviour, not licensing, so lift the fallback to ADVANCED here.
license:
  client:
    fallback-edition: ADVANCED

# Disable Nacos gRPC for tests to avoid connection errors
nacos:
  naming:
    push:
      empty-protection: false