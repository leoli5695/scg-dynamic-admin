global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules. seckill-alerts.yml lives in the seckill module's resources and is bind-mounted into
# /etc/prometheus by docker-compose (service `prometheus`, profile `monitoring`) - mounted rather
# than copied so there is only one source of truth. Before this it was referenced by nothing at
# all, so all 21 rules were dead code.
rule_files:
  - 'seckill-alerts.yml'

# No `alerting:` section on purpose: there is no Alertmanager in this stack, so rules fire and are
# visible in the Prometheus UI but page nobody. Add an Alertmanager and an `alerting:` block here
# before relying on these rules operationally.

scrape_configs:
  # ============================================================
  # 应用服务监控
  # ============================================================

  # my-gateway metrics - actuator on same port to avoid multi-port HttpHandler conflict
  # Prometheus scrapes from /actuator/prometheus endpoint
  #
  # FIX: this job used to list BOTH host.docker.internal:81 and :80 as targets. Only one can ever
  # be listening, so the other was permanently DOWN and made the whole job look half-broken.
  # application.yml defaults SERVER_PORT to 80; override the target below if you run the gateway
  # on another port.
  - job_name: 'my-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:80']
        labels:
          application: 'my-gateway'
      # K8s: will use http_sd_configs for dynamic discovery

  # gateway-admin 指标
  - job_name: 'gateway-admin'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9090']
        labels:
          application: 'gateway-admin'

  # seckill-core-engine 秒杀服务指标
  - job_name: 'seckill-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'seckill-service'

  # ============================================================
  # 中间件监控 - 动态服务发现（从 gateway-admin API 获取）
  # ============================================================
  # 新服务上报中间件后，Prometheus 自动发现并开始采集
  # 无需手动配置每个 exporter

  # ============================================================
  # 中间件监控 - 动态服务发现（从 gateway-admin API 获取）
  # ============================================================
  # 新服务上报中间件后，Prometheus 自动发现并开始采集
  # 无需手动配置每个 exporter
  #
  # AUTH: /api/prometheus/sd/** is in InternalApiEndpoints.TOKEN_PROTECTED, so it requires the
  # shared internal token - without credentials this job gets 401 and stays permanently DOWN.
  # Stock Prometheus http_sd_configs cannot send an arbitrary header such as X-Internal-Token, so
  # InternalApiTokenFilter also accepts `Authorization: Bearer <token>` and the token is read from
  # a file. Create it once (it is gitignored):
  #
  #   printf '%s' "$GATEWAY_INTERNAL_TOKEN" > prometheus/internal-token
  #
  # and docker-compose mounts it at /etc/prometheus/internal-token.
  - job_name: 'middleware-exporters'
    http_sd_configs:
      - url: 'http://host.docker.internal:9090/api/prometheus/sd/exporters'
        refresh_interval: 30s
        authorization:
          type: Bearer
          credentials_file: /etc/prometheus/internal-token
    relabel_configs:
      # 将 middleware_type label 映射到 application
      - source_labels: [middleware_type]
        target_label: application
      # 设置 component label
      - source_labels: [middleware_type]
        regex: '(redis|mysql|postgresql|mongodb)'
        target_label: component
        replacement: 'database'
      - source_labels: [middleware_type]
        regex: '(rocketmq|kafka|rabbitmq)'
        target_label: component
        replacement: 'mq'
      - source_labels: [middleware_type]
        regex: '(elasticsearch)'
        target_label: component
        replacement: 'search'

  # ============================================================
  # 中间件监控 - 静态配置（备用/兜底）
  # ============================================================
  # Commented out on purpose. These target the service names `mysqld-exporter` and `redis-exporter`,
  # which do not exist in docker-compose.yml - the exporters are only deployed by k8s/exporters.yaml
  # and k8s/middleware-exporters.yaml. Left enabled they were two permanently-DOWN jobs, which is
  # worse than no job because it trains you to ignore red targets. Uncomment and adjust the target
  # hostnames if you run the exporters on the compose network.
  #
  # # MySQL Exporter - 数据库性能监控
  # - job_name: 'mysql-static'
  #   static_configs:
  #     - targets: ['mysqld-exporter:9104']
  #       labels:
  #         application: 'mysql'
  #         component: 'database'
  #
  # # Redis Exporter - 缓存性能监控
  # - job_name: 'redis-static'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         application: 'redis'
  #         component: 'cache'

  # ============================================================
  # 动态服务发现 - 用于生产环境
  # ============================================================
  # 注意：以下配置仅在生产环境（K8s）中使用
  # Docker Compose 环境请注释掉或删除

  # Consul 服务发现 - 自动发现注册到 Consul 的服务
  # - job_name: 'consul-services'
  #   consul_sd_configs:
  #     - server: 'consul:8500'
  #       services: []  # 空数组表示发现所有服务
  #   relabel_configs:
  #     - source_labels: [__meta_consul_service]
  #       target_label: service
  #     - source_labels: [__meta_consul_tags]
  #       regex: '.*,prometheus,.*'
  #       action: keep

  # Nacos 服务发现 - 通过 HTTP API 获取服务列表
  # - job_name: 'nacos-services'
  #   metrics_path: '/actuator/prometheus'
  #   http_sd_configs:
  #     - url: 'http://nacos:8848/nacos/v1/ns/instance/list?serviceName=gateway-services'
  #       refresh_interval: 30s